  <radialGradient id="halo"><stop stop-color="#E6B553" stop-opacity=".20"/><stop offset="1" stop-color="#E6B553" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#A3C0B8" fill-opacity=".15"/></pattern>
