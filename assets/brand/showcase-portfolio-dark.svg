<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="600" viewBox="0 0 1440 600" role="img" aria-labelledby="title desc">
<title id="title">Showcase Studio — Workflows verständlich präsentieren</title>
<desc id="desc">Breites redaktionelles Showcase-Studio-Banner mit dem originalen goldenen S-Zeichen und einem abstrahierten Workflow vom Auslöser über Prüfung zu HTML und PDF. Konzeptgrafik, kein App-Screenshot.</desc>
<defs>
