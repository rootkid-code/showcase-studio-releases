<pattern id="dots" width="27" height="27" patternUnits="userSpaceOnUse"><circle cx="1.4" cy="1.4" r="1" fill="#53716D" fill-opacity=".12"/></pattern>
<linearGradient id="sc-flow" x1="44" y1="18" x2="20" y2="46" gradientUnits="userSpaceOnUse"><stop stop-color="#F7D774"/><stop offset="1" stop-color="#E59E2E"/></linearGradient>
<linearGradient id="sc-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse"><stop stop-color="#1A242C"/><stop offset="1" stop-color="#0B1014"/></linearGradient>
<linearGradient id="route" x1="730" y1="185" x2="1175" y2="185" gradientUnits="userSpaceOnUse"><stop stop-color="#F7D774"/><stop offset=".52" stop-color="#E59E2E"/><stop offset="1" stop-color="#A6E0C6"/></linearGradient>
</defs>
